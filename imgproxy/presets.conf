# imgproxy presets — one per UI placement (see api/ElBaul.Infra/ImgproxyUrlBuilder.cs,
# which maps ImagePlacement values to these names and references them via "pr:name").
# ONLY_PRESETS is off (see Dockerfile) so ImgproxyUrlBuilder can append gravity:fp/zoom
# on top of persona-avatar for per-persona crop; the HMAC signature is what actually
# keeps a leaked URL from requesting an arbitrary render, not this file.
photo-grid-thumbnail=resizing_type:fill/width:400/height:400/gravity:sm
photo-full=resizing_type:fit/width:1600/height:1600
chapter-cover=resizing_type:fill/width:500/height:500/gravity:sm
chapter-cover-featured=resizing_type:fill/width:800/height:500/gravity:sm
removal-request-thumbnail=resizing_type:fill/width:480/height:360/gravity:sm
invitation-preview=resizing_type:fill/width:640/height:400/gravity:sm
baul-cover=resizing_type:fill/width:800/height:500/gravity:sm
persona-avatar=resizing_type:fill/width:200/height:200/gravity:sm
