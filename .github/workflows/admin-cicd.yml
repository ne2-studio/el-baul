name: Admin CI/CD

on:
  push:
    paths:
      - '.github/workflows/admin-cicd.yml'
      - 'admin/**'
      # Admin acceptance runs el-baul-api-lite next to the admin image, so changes to the lite
      # stack can break this pipeline even when admin/ itself still builds.
      - 'api/ElBaul.Core/**'
      - 'api/ElBaul.Api/**'
      - 'api/ElBaul.Host.Lite/**'
      - 'api/ElBaul.Infra.Shared/**'
      - 'api/ElBaul.Infra.Lite/**'
      - 'api/openapi/**'
      - 'docker-compose.lite.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/admin-cicd.yml'
      - 'admin/**'
      # Admin acceptance runs el-baul-api-lite next to the admin image, so changes to the lite
      # stack can break this pipeline even when admin/ itself still builds.
      - 'api/ElBaul.Core/**'
      - 'api/ElBaul.Api/**'
      - 'api/ElBaul.Host.Lite/**'
      - 'api/ElBaul.Infra.Shared/**'
      - 'api/ElBaul.Infra.Lite/**'
      - 'api/openapi/**'
      - 'docker-compose.lite.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: admin-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-admin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: admin

      - name: Build/test generated API contract
        uses: ./.github/actions/verify-openapi-types
        with:
          target: admin
          generated-schema: admin/src/api/generated/schema.ts

      - name: Build/test admin
        run: VERIFY_COVERAGE=1 ./scripts/verify admin

      - name: Build/test coverage report
        uses: ./.github/actions/publish-node-coverage
        with:
          title: Admin test coverage
          summary-path: admin/coverage/summary.txt
          artifact-name: admin-coverage-report
          artifact-path: admin/coverage

      - name: Verify setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: admin
          cache-dependency-path: admin/package-lock.json

      # Only for the acceptance test below (and local Docker Compose) — production is served by
      # Cloudflare Pages from the `deploy` job. No --build-arg VITE_* here on purpose: this image
      # reads its VITE_* config at container start (see admin/src/runtimeConfig.ts +
      # admin/docker-entrypoint.d/), as docker-compose.yaml's `admin` service does for local dev.
      - name: Package admin image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: admin
          cache-scope: admin-app

      - name: Scan admin image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest

      - name: Package acceptance API image
        uses: ./.github/actions/docker-build-image
        with:
          image: el-baul-api-lite:ci
          context: api
          dockerfile: api/ElBaul.Host.Lite/Dockerfile
          build-contexts: lib=lib/Ne2Studio.Common
          cache-scope: api-lite

      - name: Verify packaged admin
        env:
          ADMIN_IMAGE: ${{ env.IMAGE_NAME }}:latest
          API_LITE_IMAGE: el-baul-api-lite:ci
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build admin-acceptance

      - name: Verify Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-playwright-report
          path: admin/playwright-report/
          retention-days: 7

  # Deploys admin/ to Cloudflare Pages (project el-baul-admin): push to main -> production
  # (admin-prod.el-baul.ne2.studio); same-repo PR -> preview at <branch>.el-baul-admin.pages.dev.
  # Pushes to other branches only run `build`. Fork PRs get no secrets, so they never deploy.
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    # Holds the VITE_* values. No deployment branch policy, so PR previews can use it too
    # (previews therefore talk to the production API/OIDC client).
    environment: admin-production
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
      VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
      VITE_OIDC_CALLBACK_URI: ${{ vars.VITE_OIDC_CALLBACK_URI }}
      VITE_ZITADEL_ORGANIZATION_ID: ${{ vars.VITE_ZITADEL_ORGANIZATION_ID }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Release setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: admin

      - name: Release admin dist
        working-directory: admin
        run: npm run build

      # Same render docker-entrypoint.d/95-generate-runtime-env.sh does at container start
      # (same explicit variable list), done once here because Pages serves static files only.
      - name: Release runtime config
        working-directory: admin
        run: |
          envsubst '${VITE_API_URL} ${VITE_OIDC_AUTHORITY} ${VITE_OIDC_CLIENT_ID} ${VITE_OIDC_CALLBACK_URI} ${VITE_ZITADEL_ORGANIZATION_ID} ${VITE_APP_URL}' \
            < dist/env-config.template.js \
            > dist/env-config.js
          # Pages only falls back to index.html (SPA routing) when there is no 404.html.
          test ! -e dist/404.html

      - name: Deploy admin
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: pages deploy dist --project-name=el-baul-admin --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/comment-pages-preview
        with:
          name: admin
          url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          token: ${{ github.token }}
