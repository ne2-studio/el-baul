name: Admin CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/admin-cicd.yml'
      - 'admin/**'
      # Admin acceptance runs el-baul-api-lite next to the admin image, so changes to the lite
      # stack can break this pipeline even when admin/ itself still builds.
      - 'api/ElBaul/**'
      - 'api/ElBaul.Api.Common/**'
      - 'api/ElBaul.Api.Lite/**'
      - 'api/ElBaul.Infra.Common/**'
      - 'api/ElBaul.Infra.Lite/**'
      - 'api/openapi/**'
      - 'docker-compose.lite.yml'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: admin-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-admin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: admin

      - name: Build/test generated API contract
        uses: ./.github/actions/verify-openapi-types
        with:
          target: admin
          generated-schema: admin/src/api/generated/schema.ts

      - name: Build/test admin
        run: VERIFY_COVERAGE=1 ./scripts/verify admin

      - name: Build/test coverage report
        uses: ./.github/actions/publish-node-coverage
        with:
          title: Admin test coverage
          summary-path: admin/coverage/summary.txt
          artifact-name: admin-coverage-report
          artifact-path: admin/coverage

      - name: Verify setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: admin
          cache-dependency-path: admin/package-lock.json

      # No --build-arg VITE_* here on purpose: this image reads its VITE_* config at container
      # start instead (see admin/src/runtimeConfig.ts + admin/docker-entrypoint.d/), configured
      # as Coolify's runtime Environment Variables on the admin service — not build args, not
      # GitHub Actions repo/environment vars. docker-compose.yaml's `admin` service configures
      # the same thing the same way for local dev.
      - name: Package admin image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: admin
          cache-scope: admin-app

      - name: Scan admin image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest

      - name: Package acceptance API image
        uses: ./.github/actions/docker-build-image
        with:
          image: el-baul-api-lite:ci
          context: api
          dockerfile: api/ElBaul.Api.Lite/Dockerfile
          cache-scope: api-lite

      - name: Verify packaged admin
        env:
          ADMIN_IMAGE: ${{ env.IMAGE_NAME }}:latest
          API_LITE_IMAGE: el-baul-api-lite:ci
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build admin-acceptance

      - name: Verify Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-playwright-report
          path: admin/playwright-report/
          retention-days: 7

      - name: Release admin image
        uses: ./.github/actions/release-ghcr-image
        with:
          image: ${{ env.IMAGE_NAME }}
          context: admin
          cache-scope: admin-app
          sha: ${{ github.sha }}
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: admin-production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy admin
        uses: ./.github/actions/deploy-coolify
        with:
          service: admin
          webhook: ${{ secrets.COOLIFY_WEBHOOK_ADMIN }}
          token: ${{ secrets.COOLIFY_API_TOKEN }}
