name: Devcontainer Image

on:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'
      - 'api/**/*.csproj'
      - 'api/**/*.slnx'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'admin/package.json'
      - 'admin/package-lock.json'
      - 'e2e-tests/package.json'
      - 'e2e-tests/package-lock.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}-devcontainer"
          ref_tag="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"

          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${image_name}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "ref_tag=${image_name}:${ref_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and push devcontainer image
        run: |
          npx --yes @devcontainers/cli@0.80.2 build \
            --workspace-folder . \
            --image-name "${{ steps.image.outputs.sha_tag }}" \
            --cache-from "${{ steps.image.outputs.name }}:latest" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --push

      - name: Publish stable tags
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.ref_tag }}" \
            "${{ steps.image.outputs.sha_tag }}"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker buildx imagetools create \
              -t "${{ steps.image.outputs.name }}:latest" \
              "${{ steps.image.outputs.sha_tag }}"
          fi
