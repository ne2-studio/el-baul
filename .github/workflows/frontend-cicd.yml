name: Frontend CI/CD

on:
  push:
    paths:
      - '.github/workflows/frontend-cicd.yml'
      - 'app/**'
      - 'docker-compose.lite.yml'
      - 'scripts/**'
      # Everything el-baul-api-lite is built from (see api/ElBaul.Host.Lite/Dockerfile) — this
      # pipeline builds and runs that image as part of its acceptance test, so a change to any
      # of these can break it just as much as a change under app/ can.
      - 'api/ElBaul.Core/**'
      - 'api/ElBaul.Api/**'
      - 'api/ElBaul.Host.Lite/**'
      - 'api/ElBaul.Infra.Shared/**'
      - 'api/ElBaul.Infra.Lite/**'
      - 'api/openapi/**'
  pull_request:
    paths:
      - '.github/workflows/frontend-cicd.yml'
      - 'app/**'
      - 'docker-compose.lite.yml'
      - 'scripts/**'
      # Everything el-baul-api-lite is built from (see api/ElBaul.Host.Lite/Dockerfile) — this
      # pipeline builds and runs that image as part of its acceptance test, so a change to any
      # of these can break it just as much as a change under app/ can.
      - 'api/ElBaul.Core/**'
      - 'api/ElBaul.Api/**'
      - 'api/ElBaul.Host.Lite/**'
      - 'api/ElBaul.Infra.Shared/**'
      - 'api/ElBaul.Infra.Lite/**'
      - 'api/openapi/**'

permissions:
  contents: read

concurrency:
  group: frontend-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: app

      - name: Build/test generated API contract
        uses: ./.github/actions/verify-openapi-types
        with:
          target: app
          generated-schema: app/src/api/generated/schema.ts

      - name: Build/test browser setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: app
          cache-dependency-path: app/package-lock.json

      - name: Build/test frontend
        run: VERIFY_COVERAGE=1 ./scripts/verify frontend

      - name: Build/test coverage report
        uses: ./.github/actions/publish-node-coverage
        with:
          title: Frontend test coverage
          summary-path: app/coverage/summary.txt
          artifact-name: frontend-coverage-report
          artifact-path: app/coverage

      - name: Package frontend image
        # Only for the acceptance test below (and local Docker Compose) — production is served by
        # Cloudflare Pages from the `deploy` job. No VITE_* build args: the image reads runtime
        # config at container start.
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: app
          cache-scope: frontend-app

      - name: Scan frontend image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest

      - name: Package acceptance API image
        uses: ./.github/actions/docker-build-image
        with:
          image: el-baul-api-lite:ci
          context: api
          dockerfile: api/ElBaul.Host.Lite/Dockerfile
          build-contexts: lib=lib/Ne2Studio.Common
          cache-scope: api-lite

      - name: Verify packaged frontend
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}:latest
          API_LITE_IMAGE: el-baul-api-lite:ci
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build frontend-acceptance

      - name: Verify Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # Deploys app/ to Cloudflare Pages (project el-baul-app): push to main -> production
  # (app-prod.el-baul.ne2.studio); same-repo PR -> preview at <branch>.el-baul-app.pages.dev.
  # Pushes to other branches only run `build`. Fork PRs get no secrets, so they never deploy.
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    # Holds the VITE_* values. No deployment branch policy, so PR previews can use it too
    # (previews therefore talk to the production API/OIDC client).
    environment: frontend-production
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
      VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
      VITE_OIDC_CALLBACK_URI: ${{ vars.VITE_OIDC_CALLBACK_URI }}
      VITE_ZITADEL_ORGANIZATION_ID: ${{ vars.VITE_ZITADEL_ORGANIZATION_ID }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}

    steps:
      - uses: actions/checkout@v7

      - name: Release setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: app

      - name: Release frontend dist
        working-directory: app
        run: npm run build

      # Same render docker-entrypoint.d/95-generate-runtime-env.sh does at container start
      # (same explicit variable list), done once here because Pages serves static files only.
      - name: Release runtime config
        working-directory: app
        run: |
          envsubst '${VITE_API_URL} ${VITE_OIDC_AUTHORITY} ${VITE_OIDC_CLIENT_ID} ${VITE_OIDC_CALLBACK_URI} ${VITE_ZITADEL_ORGANIZATION_ID} ${VITE_SENTRY_DSN} ${VITE_PUBLIC_POSTHOG_PROJECT_TOKEN} ${VITE_PUBLIC_POSTHOG_HOST}' \
            < dist/env-config.template.js \
            > dist/env-config.js
          # Pages only falls back to index.html (SPA routing) when there is no 404.html.
          test ! -e dist/404.html

      - name: Release Sentry sourcemaps
        if: github.event_name == 'push'
        working-directory: app
        run: npm run sentry:upload-sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy frontend
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=el-baul-app --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/comment-pages-preview
        with:
          name: app
          url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          token: ${{ github.token }}
