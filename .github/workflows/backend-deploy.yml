name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backend-deploy.yml'
      - 'api/**'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore api/ElBaul.slnx

      - name: Run backend verification
        run: VERIFY_COVERAGE=1 ./scripts/verify backend

      # Merges the per-project cobertura files coverlet drops under coverage/<guid>/ (one per
      # xunit project: ElBaul.Tests, ElBaul.Api.Tests, ElBaul.Infra.Tests) into a single
      # markdown report with a combined total plus a per-assembly breakdown.
      - name: Publish coverage summary
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"api/coverage/**/coverage.cobertura.xml" \
            -targetdir:"api/coverage/report" \
            -reporttypes:"MarkdownSummaryGithub;Html"
          cat api/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: api/coverage/report
          retention-days: 7

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: docker build -t $IMAGE_NAME:latest api

      - name: Run backend acceptance verification
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:latest
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build backend-acceptance

      - name: Push image
        run: docker push $IMAGE_NAME:latest

      - name: Trigger Coolify deploy
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_BACKEND }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
