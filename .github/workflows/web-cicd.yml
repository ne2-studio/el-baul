name: Web CI/CD

on:
  push:
    paths:
      - '.github/workflows/web-cicd.yml'
      - 'web/**'
  pull_request:
    paths:
      - '.github/workflows/web-cicd.yml'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo site
        working-directory: web
        run: hugo --minify --environment production

  # Deploys web/ to Cloudflare Pages (project el-baul-web): push to main -> production
  # (el-baul-web.ne2.studio); same-repo PR -> preview at <branch>.el-baul-web.pages.dev.
  # Pushes to other branches only run `build`. Fork PRs get no secrets, so they never deploy.
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # Previews use relative URLs so their links don't jump to production. layouts/404.html
      # becomes public/404.html, which Pages serves (with a 404) for unknown paths.
      - name: Build Hugo site
        working-directory: web
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && '/' || '' }}
        run: |
          hugo --minify --environment production ${BASE_URL:+--baseURL "$BASE_URL"}
          test -e public/404.html

      - name: Deploy web
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy public --project-name=el-baul-web --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/comment-pages-preview
        with:
          name: web
          url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          token: ${{ github.token }}
