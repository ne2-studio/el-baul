name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frontend-deploy.yml'
      - 'app/**'
      - 'docker-compose.lite.yml'
      - 'scripts/**'
      # Everything el-baul-api-lite is built from (see api/ElBaul.Api.Lite/Dockerfile) — this
      # pipeline builds and runs that image as part of its acceptance test, so a change to any
      # of these can break it just as much as a change under app/ can.
      - 'api/ElBaul/**'
      - 'api/ElBaul.Api.Common/**'
      - 'api/ElBaul.Api.Lite/**'
      - 'api/ElBaul.Infra.Common/**'
      - 'api/ElBaul.Infra.Lite/**'
      - 'api/openapi/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Check generated OpenAPI TypeScript types
        run: |
          ./scripts/openapi generate-types app
          git diff --exit-code -- app/src/api/generated/schema.ts

      - name: Run frontend verification
        run: VERIFY_COVERAGE=1 ./scripts/verify frontend

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Frontend test coverage'
            echo '```'
            cat app/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: app/coverage
          retention-days: 7

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright browsers (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium

      - name: Build frontend acceptance images
        # No VITE_* build args are passed for app: the image reads runtime config at container
        # start, matching production deployment.
        run: |
          docker build -t $IMAGE_NAME:latest app
          docker build -f api/ElBaul.Api.Lite/Dockerfile -t el-baul-api-lite:ci api

      - name: Run frontend acceptance verification
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}:latest
          API_LITE_IMAGE: el-baul-api-lite:ci
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build frontend-acceptance

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

      - name: Push image
        run: docker push $IMAGE_NAME:latest

      - name: Trigger Coolify deploy
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

      - name: Extract dist from the built image
        working-directory: app
        run: |
          docker create --name extract $IMAGE_NAME:latest
          docker cp extract:/usr/share/nginx/html ./dist
          docker rm extract

      - name: Upload sourcemaps to Sentry
        working-directory: app
        run: npm run sentry:upload-sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
