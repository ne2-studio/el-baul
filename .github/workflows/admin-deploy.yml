name: Admin CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/admin-deploy.yml'
      - 'admin/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-admin

defaults:
  run:
    working-directory: admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Admin unit test coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-coverage-report
          path: admin/coverage
          retention-days: 7

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # No --build-arg VITE_* here on purpose: this image reads its VITE_* config at container
      # start instead (see admin/src/runtimeConfig.ts + admin/docker-entrypoint.d/), configured
      # as Coolify's runtime Environment Variables on the admin service — not build args, not
      # GitHub Actions repo/environment vars. docker-compose.yaml's `admin` service configures
      # the same thing the same way for local dev.
      - name: Build image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Push image
        run: docker push $IMAGE_NAME:latest

      - name: Trigger Coolify deploy
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_ADMIN }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
