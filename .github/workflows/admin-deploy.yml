name: Admin CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/admin-deploy.yml'
      - 'admin/**'
      # Admin acceptance runs el-baul-api-lite next to the admin image, so changes to the lite
      # stack can break this pipeline even when admin/ itself still builds.
      - 'api/ElBaul/**'
      - 'api/ElBaul.Api.Common/**'
      - 'api/ElBaul.Api.Lite/**'
      - 'api/ElBaul.Infra.Common/**'
      - 'api/ElBaul.Infra.Lite/**'
      - 'api/openapi/**'
      - 'docker-compose.lite.yml'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Check generated OpenAPI TypeScript types
        run: |
          ./scripts/openapi generate-types admin
          git diff --exit-code -- admin/src/api/generated/schema.ts

      - name: Run admin verification
        run: VERIFY_COVERAGE=1 ./scripts/verify admin

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Admin test coverage'
            echo '```'
            cat admin/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-coverage-report
          path: admin/coverage
          retention-days: 7

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('admin/package-lock.json') }}

      - name: Install Playwright browsers (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: admin
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: admin
        run: npx playwright install-deps chromium

      # No --build-arg VITE_* here on purpose: this image reads its VITE_* config at container
      # start instead (see admin/src/runtimeConfig.ts + admin/docker-entrypoint.d/), configured
      # as Coolify's runtime Environment Variables on the admin service — not build args, not
      # GitHub Actions repo/environment vars. docker-compose.yaml's `admin` service configures
      # the same thing the same way for local dev.
      - name: Build admin acceptance images
        run: |
          docker build -t $IMAGE_NAME:latest admin
          docker build -f api/ElBaul.Api.Lite/Dockerfile -t el-baul-api-lite:ci api

      - name: Run admin acceptance verification
        env:
          ADMIN_IMAGE: ${{ env.IMAGE_NAME }}:latest
          API_LITE_IMAGE: el-baul-api-lite:ci
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build admin-acceptance

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: admin/playwright-report/
          retention-days: 7

      - name: Push image
        run: docker push $IMAGE_NAME:latest

      - name: Trigger Coolify deploy
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_ADMIN }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
