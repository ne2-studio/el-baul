name: Storybook CI/CD

on:
  push:
    paths:
      - '.github/workflows/storybook-cicd.yml'
      - 'app/**'
      - 'storybook/**'
  pull_request:
    paths:
      - '.github/workflows/storybook-cicd.yml'
      - 'app/**'
      - 'storybook/**'

permissions:
  contents: read

concurrency:
  group: storybook-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: app

      - name: Build/test browser setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: app
          cache-dependency-path: app/package-lock.json

      - name: Verify Storybook executable specs
        working-directory: app
        run: npm run test:storybook

  # Deploys app/'s Storybook to Cloudflare Pages (project el-baul-storybook): push to main ->
  # production (storybook.el-baul.ne2.studio); same-repo PR -> preview at
  # <branch>.el-baul-storybook.pages.dev. Pushes to other branches only run `build`. Fork PRs get
  # no secrets, so they never deploy.
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Build setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: app

      - name: Build Storybook
        working-directory: app
        run: npm run build-storybook

      - name: Deploy Storybook
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy storybook-static --project-name=el-baul-storybook --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/comment-pages-preview
        with:
          name: Storybook
          url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          token: ${{ github.token }}
