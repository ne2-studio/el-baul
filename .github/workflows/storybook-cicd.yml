name: Storybook CI/CD

on:
  push:
    paths:
      - '.github/workflows/storybook-cicd.yml'
      - 'app/**'
      - 'storybook/**'
  pull_request:
    paths:
      - '.github/workflows/storybook-cicd.yml'
      - 'app/**'
      - 'storybook/**'

permissions:
  contents: read

concurrency:
  group: storybook-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-storybook

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: app

      - name: Build/test browser setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: app
          cache-dependency-path: app/package-lock.json

      - name: Verify Storybook executable specs
        working-directory: app
        run: npm run test:storybook

      # Build context is the repo root - see storybook/Dockerfile.
      - name: Package Storybook image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: .
          dockerfile: storybook/Dockerfile
          cache-scope: storybook

      - name: Scan Storybook image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest

  # Only main deploys: builds the image again (layers come from the build job's cache),
  # pushes it to GHCR and triggers Coolify. Other branches and PRs never push or deploy.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: storybook-production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Build deploy Storybook image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: .
          dockerfile: storybook/Dockerfile
          cache-scope: storybook

      - name: Release storybook image
        uses: ./.github/actions/release-ghcr-image
        with:
          image: ${{ env.IMAGE_NAME }}
          sha: ${{ github.sha }}
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Storybook
        uses: ./.github/actions/deploy-coolify
        with:
          service: storybook
          webhook: ${{ vars.COOLIFY_WEBHOOK_STORYBOOK }}
          token: ${{ secrets.COOLIFY_API_TOKEN }}
