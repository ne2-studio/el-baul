name: Imgproxy CI/CD

on:
  push:
    paths:
      - '.github/workflows/imgproxy-cicd.yml'
      - 'imgproxy/**'
  pull_request:
    paths:
      - '.github/workflows/imgproxy-cicd.yml'
      - 'imgproxy/**'

permissions:
  contents: read

concurrency:
  group: imgproxy-cicd-${{ github.ref }}
  # Never cancel a main run (it may be mid-deploy); supersede stale runs on other refs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-imgproxy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Package imgproxy image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: imgproxy
          cache-scope: imgproxy

      - name: Scan imgproxy image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          trivyignores: imgproxy/.trivyignore

  # Only main deploys: builds the image again (layers come from the build job's cache),
  # pushes it to GHCR and triggers Coolify. Other branches and PRs never push or deploy.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: imgproxy-production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Build deploy imgproxy image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: imgproxy
          cache-scope: imgproxy

      - name: Release imgproxy image
        uses: ./.github/actions/release-ghcr-image
        with:
          image: ${{ env.IMAGE_NAME }}
          sha: ${{ github.sha }}
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy imgproxy
        uses: ./.github/actions/deploy-coolify
        with:
          service: imgproxy
          webhook: ${{ vars.COOLIFY_WEBHOOK_IMGPROXY }}
          token: ${{ secrets.COOLIFY_API_TOKEN }}
