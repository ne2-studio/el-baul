name: E2E smoke tests (nightly)

on:
  schedule:
    # 03:00 UTC daily. Always builds api/app/imgproxy fresh from current main,
    # regardless of whether anything actually changed.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: e2e-tests

      - name: Verify browser setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: e2e-tests
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Verify deployed stack smoke
        run: ./scripts/verify e2e

      - name: Verify Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 7
