name: Setup Playwright
description: Restore the Playwright browser cache and install Chromium.

# No `install-deps` / `--with-deps`: the ubuntu-latest runner image already ships every
# library Chromium needs. On top of that, apt only adds CJK/Thai fonts and xfonts, while
# fetching them from the runner's Ubuntu mirror sometimes took minutes.

inputs:
  working-directory:
    description: Directory containing the Playwright package.
    required: true
  cache-dependency-path:
    description: Lockfile used to key the Playwright browser cache.
    required: true

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install chromium
