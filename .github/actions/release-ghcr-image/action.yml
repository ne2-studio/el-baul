name: Release GHCR image
description: Push the already-built and verified image to GHCR tagged both :latest and :sha-<commit>.

inputs:
  image:
    description: Base image ref without a tag, e.g. ghcr.io/org/repo-api.
    required: true
  sha:
    description: Commit SHA to tag the image with, for rollback and audit.
    required: true
  username:
    description: GHCR username.
    required: true
  token:
    description: GHCR token.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: Tag image with commit SHA
      shell: bash
      run: docker tag "${{ inputs.image }}:latest" "${{ inputs.image }}:sha-${{ inputs.sha }}"

    - name: Push image tags
      shell: bash
      run: |
        docker push "${{ inputs.image }}:latest"
        docker push "${{ inputs.image }}:sha-${{ inputs.sha }}"
