name: Build Docker image
description: Build a Docker image, loading it into the local daemon, using the GitHub Actions cache.

inputs:
  image:
    description: Image tag to build.
    required: true
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Optional Dockerfile path.
    required: false
    default: ""
  cache-scope:
    description: Cache scope key. Keeps unrelated images from colliding in the shared GHA cache.
    required: true
  build-contexts:
    description: |
      Optional extra named build contexts (docker/build-push-action's build-contexts input,
      one "name=path" per line) for Dockerfiles that COPY --from=<name> a directory outside
      their primary context.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-contexts: ${{ inputs.build-contexts }}
        tags: ${{ inputs.image }}
        load: true
        push: false
        pull: true
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
