name: Build Docker image
description: Build a Docker image, loading it into the local daemon, using the GitHub Actions cache.

inputs:
  image:
    description: Image tag to build.
    required: true
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Optional Dockerfile path.
    required: false
    default: ""
  cache-scope:
    description: Cache scope key. Keeps unrelated images from colliding in the shared GHA cache.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        tags: ${{ inputs.image }}
        load: true
        push: false
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
